<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#050507" />
  <title>Perla Jbara | Portfolio</title>

  <script>
    // Skip the vault intro for anyone who has already unlocked it this session,
    // so returning visitors (or a recruiter clicking between pages) land straight
    // on the portfolio. Add ?replay=1 to the URL to force the intro again.
    (function () {
      var forceReplay = /[?&]replay=1\b/.test(window.location.search);
      if (!forceReplay && sessionStorage.getItem('vaultUnlocked') === '1') {
        window.location.replace('home.html');
      }
    })();
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
      }
    }
  </script>

   <link rel="stylesheet" href="indexstyle.css">

</head>
<body>

  <div id="page-wrapper">
    <div class="vault" id="vault">
      
      <div class="panel left-side left-top"></div>
      <div class="panel left-side left-bottom"></div>
      <div class="panel right-side right-main"></div>

      <div class="seal-track" id="laser-track">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%; height:100%;">
          <path d="M 50,0 L 50,0 L 60,30 L 40,70 L 50,100" class="laser-line" id="seam-laser" />
        </svg>
      </div>

      <div class="center-hub" id="lock-hub">
        <div class="hub-ring outer"></div>
        <div class="hub-ring inner">
          <div class="vault-crosshairs"></div>
        </div>
        <svg class="loading-svg">
          <circle cx="50%" cy="50%" r="38%" class="loading-circle" id="loading-arc" />
        </svg>
      </div>

      <div class="light-spill"></div>

      <div class="interface-hud">
        <div class="top-hud">
          <div class="status-panel" id="status"></div>
          <div class="access-display" id="access-banner">ACCESS GRANTED</div>
        </div>
        <div>
          <div class="counter-display" id="counter">00%</div>
        </div>
      </div>

      <canvas id="three-canvas"></canvas>
    </div>
  </div>

  <canvas id="pearls-canvas"></canvas>
  <div class="particles" id="ambient-particles"></div>

  <a href="home.html" class="skip-link" id="skipLink">SKIP INTRO →</a>

  <div class="entry-gate" id="entryGate">
    <div class="entry-gate-inner">
      <div class="entry-mark">PJ</div>
      <div class="entry-title">PERLA JBARA</div>
      <div class="entry-role">FULL STACK SOFTWARE ENGINEER</div>
      <button type="button" class="enter-btn" id="enterBtn">
        <span class="enter-ring"></span>
        TAP TO UNLOCK
      </button>
    </div>
  </div>

 <script type="module" src="indexscript.js"></script>
</body>
</html>
