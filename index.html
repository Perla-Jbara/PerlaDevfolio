<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perla Jbara | Portfolio</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.152.2/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --obsidian-dark: #050507;
      --obsidian-panel: #0f1013;
      --rose-gold: #d4a0a0;
      --rose-glow: rgba(212, 160, 160, 0.75);
      --neon-spill: rgba(230, 140, 140, 0.9);
      --pearl-bright: #fff5f5;
    }

    /* ================= BASE ================= */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--obsidian-dark);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--pearl-bright);
      height: 100vh;
      width: 100vw;
    }

    /* ================= BACKGROUND PARTICLES ================= */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .p {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--rose-gold);
      border-radius: 50%;
      animation: float 7s linear infinite;
    }
    @keyframes float {
      from { transform: translateY(105vh); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      to { transform: translateY(-5vh); opacity: 0; }
    }

    /* ================= TRANSITION WRAPPER ================= */
    #page-wrapper {
      position: fixed;
      inset: 0;
      z-index: 99;
      transition: transform 1.6s cubic-bezier(0.85, 0, 0.15, 1);
      will-change: transform;
    }
    body.pull-up #page-wrapper {
      transform: translateY(-100vh);
    }

    /* ================= VAULT CONTAINER ================= */
    .vault {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #010102;
      overflow: hidden;
    }

    /* ================= LIGHT SPILL LAYER ================= */
    .light-spill {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, var(--neon-spill) 0%, rgba(5,5,7,0) 70%);
      z-index: 3;
      opacity: 0;
      mix-blend-mode: screen;
      pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .vault.open .light-spill {
      opacity: 1;
      animation: flashSpill 2.5s ease forwards;
    }
    @keyframes flashSpill {
      0% { opacity: 0; transform: scale(0.3); }
      15% { opacity: 1; transform: scale(1.2); filter: blur(4px); }
      60% { opacity: 0.8; transform: scale(1.0); filter: blur(0px); }
      100% { opacity: 0.4; }
    }

    /* ================= HEAVY 3D BRUSHED METAL PANELS ================= */
    .panel {
      position: absolute;
      top: 0;
      height: 100%;
      background: 
        repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0) 4px),
        linear-gradient(125deg, #18191e 0%, #0d0e11 25%, #16171c 50%, #08080a 75%, #111216 100%);
      box-shadow: 
        inset 0 0 100px rgba(0, 0, 0, 0.9),
        inset 0 0 30px rgba(212, 160, 160, 0.04);
      transition: transform 2.8s cubic-bezier(0.76, 0, 0.24, 1);
      will-change: transform;
      z-index: 4;
    }

    .left-side { 
      width: 65%; 
      left: 0; 
      filter: drop-shadow(4px 0px 8px rgba(0, 0, 0, 0.8)) drop-shadow(20px 0px 30px rgba(0, 0, 0, 0.9)); 
    }
    .right-side { 
      width: 65%; 
      right: 0; 
      filter: drop-shadow(-4px 0px 8px rgba(0, 0, 0, 0.8)) drop-shadow(-20px 0px 30px rgba(0, 0, 0, 0.9));
    }

    /* Asymmetric Interlocking Cuts */
    .left-top {
      height: 50%;
      clip-path: polygon(0% 0%, 76.92% 0%, 92.3% 60%, 76.92% 100%, 0% 100%);
    }
    .left-bottom {
      height: 50%;
      top: 50%;
      clip-path: polygon(0% 0%, 76.92% 0%, 61.54% 40%, 76.92% 100%, 0% 100%);
    }
    .right-main {
      height: 100%;
      clip-path: polygon(23.08% 0%, 100% 0%, 100% 100%, 23.08% 100%, 8.46% 70%, 23.08% 50%, 38.46% 30%);
    }

    /* High-contrast metallic edge rim beveling */
    .panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(212, 160, 160, 0.2) 40%, transparent 41%, transparent 100%);
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* Structural grid armor seams */
    .panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-left: 4px solid rgba(0,0,0,0.4);
      border-right: 4px solid rgba(212, 160, 160, 0.05);
      background-image: linear-gradient(rgba(212, 160, 160, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(212, 160, 160, 0.02) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }

    .vault.open .left-top,
    .vault.open .left-bottom { transform: translateX(-105%); }
    .vault.open .right-main { transform: translateX(105%); }

    @media (max-width: 768px) {
      .left-side { width: 75%; }
      .right-side { width: 75%; }
      .left-top { clip-path: polygon(0% 0%, 66.6% 0%, 86.6% 60%, 66.6% 100%, 0% 100%); }
      .left-bottom { clip-path: polygon(0% 0%, 66.6% 0%, 46.6% 40%, 66.6% 100%, 0% 100%); }
      .right-main { clip-path: polygon(33.3% 0%, 100% 0%, 100% 100%, 33.3% 100%, 13.3% 70%, 33.3% 50%, 53.3% 30%); }
    }

    /* ================= GLOWING SEAM TRACK ================= */
    .seal-track {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.5s ease, filter 0.2s ease;
    }
    .vault.open .seal-track { opacity: 0; }

    .laser-line {
      position: absolute;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: var(--rose-gold);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px var(--rose-glow));
      transition: stroke-width 0.2s ease, filter 0.2s ease;
    }

    /* ================= CENTRAL HUB WHEEL ================= */
    .center-hub {
      position: absolute;
      width: clamp(240px, 35vw, 340px);
      height: clamp(240px, 35vw, 340px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 6;
      pointer-events: none;
      transition: opacity 0.5s ease, filter 0.2s ease;
    }
    .vault.open .center-hub { opacity: 0; }

    .hub-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--rose-gold);
    }
    .hub-ring.outer {
      width: 100%;
      height: 100%;
      border-style: dashed;
      opacity: 0.6;
      animation: rotateCW 50s linear infinite;
    }
    .hub-ring.inner {
      width: 82%;
      height: 82%;
      background: radial-gradient(circle, #131419 30%, #050608 100%);
      box-shadow: 0 0 50px rgba(0,0,0,0.95), inset 0 0 15px rgba(212,160,160,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    @keyframes rotateCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .vault-crosshairs {
      position: absolute;
      width: 70%;
      height: 70%;
      border: 1px solid rgba(212, 160, 160, 0.15);
      border-radius: 50%;
    }
    .vault-crosshairs::before, .vault-crosshairs::after {
      content: '';
      position: absolute;
      background: rgba(212, 160, 160, 0.3);
    }
    .vault-crosshairs::before { top: 50%; left: -10%; width: 120%; height: 1px; }
    .vault-crosshairs::after { left: 50%; top: -10%; height: 120%; width: 1px; }

    .loading-svg {
      position: absolute;
      width: 90%;
      height: 90%;
      transform: rotate(-90deg);
    }
    .loading-circle {
      fill: none;
      stroke: var(--rose-gold);
      stroke-width: 2;
      stroke-dasharray: 816;
      stroke-dashoffset: 816;
      transition: stroke-dashoffset 0.1s linear, filter 0.2s ease, stroke 0.2s ease;
    }

    /* ================= COGNITIVE HUD LAYER ================= */
    .interface-hud {
      position: absolute;
      inset: clamp(20px, 5vw, 40px);
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top-hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }
    .status-panel {
      font-size: clamp(10px, 1.5vw, 12px);
      letter-spacing: 2px;
      color: rgba(212, 160, 160, 0.5);
      line-height: 1.8;
      font-family: monospace;
    }
    .line { opacity: 0; transform: translateX(-10px); transition: 0.3s ease; }
    .line.show { opacity: 1; transform: translateX(0); }
    .line.error-log { color: #ff6b6b; font-weight: bold; background: rgba(255,0,0,0.15); padding: 2px 8px; border-radius: 3px; border-left: 3px solid #ff6b6b; }
    
    .access-display {
      font-size: clamp(12px, 2.5vw, 16px);
      font-weight: bold;
      letter-spacing: 3px;
      color: var(--rose-gold);
      text-shadow: 0 0 10px var(--rose-glow);
      opacity: 0;
      transition: opacity 0.4s ease;
      font-family: monospace;
    }
    .access-display.granted {
      opacity: 1;
      animation: alertBlink 0.4s ease alternate infinite;
    }
    @keyframes alertBlink { from { opacity: 0.4; } to { opacity: 1; } }

    .counter-display {
      font-size: clamp(16px, 3vw, 22px);
      color: var(--rose-gold);
      font-family: monospace;
    }

    /* ================= THREEJS SCREEN ENVIRONMENT ================= */
    #three-canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    body.vault-open #three-canvas { opacity: 1; }

    /* ================= TRANSITION PEARLS CANVAS ================= */
    #pearls-canvas {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="page-wrapper">
    <div class="vault" id="vault">
      
      <div class="panel left-side left-top"></div>
      <div class="panel left-side left-bottom"></div>
      <div class="panel right-side right-main"></div>

      <div class="seal-track" id="laser-track">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%; height:100%;">
          <path d="M 50,0 L 50,0 L 60,30 L 40,70 L 50,100" class="laser-line" id="seam-laser" />
        </svg>
      </div>

      <div class="center-hub" id="lock-hub">
        <div class="hub-ring outer"></div>
        <div class="hub-ring inner">
          <div class="vault-crosshairs"></div>
        </div>
        <svg class="loading-svg">
          <circle cx="50%" cy="50%" r="38%" class="loading-circle" id="loading-arc" />
        </svg>
      </div>

      <div class="light-spill"></div>

      <div class="interface-hud">
        <div class="top-hud">
          <div class="status-panel" id="status"></div>
          <div class="access-display" id="access-banner">ACCESS GRANTED</div>
        </div>
        <div>
          <div class="counter-display" id="counter">00%</div>
        </div>
      </div>

      <canvas id="three-canvas"></canvas>
    </div>
  </div>

  <canvas id="pearls-canvas"></canvas>
  <div class="particles" id="ambient-particles"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    /* ================= AUDIO HANDSHAKE ROUTINES ================= */
    let audioCtx = null;
    
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSynthTone(freq, type, duration, gainAmt) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(gainAmt, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function soundTick() { playSynthTone(900, 'sine', 0.02, 0.01); }
    function soundHeavyClunk() {
      playSynthTone(55, 'triangle', 0.5, 0.25);
      playSynthTone(110, 'sine', 0.2, 0.1);
    }
    function soundSuccess() {
      playSynthTone(523.25, 'sine', 0.08, 0.04);
      setTimeout(() => playSynthTone(1046.50, 'sine', 0.2, 0.04), 70);
    }

    document.addEventListener("click", () => initAudio(), { once: false });

    /* ================= AMBIENT SPACE FILL ================= */
    const space = document.getElementById("ambient-particles");
    for (let i = 0; i < 25; i++) {
      const dot = document.createElement("div");
      dot.className = "p";
      dot.style.left = Math.random() * 100 + "vw";
      dot.style.animationDuration = (5 + Math.random() * 4) + "s";
      dot.style.animationDelay = "-" + (Math.random() * 5) + "s";
      space.appendChild(dot);
    }

    /* ================= HUD EXECUTION SYSTEM ================= */
    const statusPanel = document.getElementById("status");
    const counterDisplay = document.getElementById("counter");
    const accessBanner = document.getElementById("access-banner");
    const loadingArc = document.getElementById("loading-arc");
    const seamLaser = document.getElementById("seam-laser");

    const logs = [
      "SYS // CORE INITIALIZATION",
      "PEARL v4.0 // CONNECTED",
      "DECRYPT // HANDSHAKE SUCCESSFUL",
      "COMPUTE // INJECTING GRAPH ARRAYS"
    ];

    let logIdx = 0;
    function printLog() {
      if (logIdx >= logs.length) return;
      const div = document.createElement("div");
      div.className = "line";
      div.textContent = `> ${logs[logIdx]}`;
      statusPanel.appendChild(div);
      setTimeout(() => div.classList.add("show"), 30);
      soundTick();
      logIdx++;
      setTimeout(printLog, 450);
    }

    let pct = 0;
    let doorsTriggered = false;
    if(loadingArc) {
      loadingArc.style.strokeDasharray = 816;
      loadingArc.style.strokeDashoffset = 816;
    }

    const progressTimer = setInterval(() => {
      if (pct >= 100) {
        clearInterval(progressTimer);
      } else {
        pct++;
        counterDisplay.textContent = `${String(pct).padStart(2, '0')}%`;
        if(loadingArc) loadingArc.style.strokeDashoffset = 816 - (816 * pct) / 100;

        if (pct > 50) {
          let intensity = (pct - 50) / 50;
          if (seamLaser) {
            seamLaser.style.filter = `drop-shadow(0 0 ${6 + intensity * 18}px rgba(240, 150, 150, ${0.75 + intensity * 0.25}))`;
            seamLaser.style.strokeWidth = `${3 + intensity * 2}px`;
          }
          if (loadingArc) {
            loadingArc.style.filter = `drop-shadow(0 0 ${4 + intensity * 12}px var(--rose-glow))`;
          }
        }

        if (pct >= 75 && !doorsTriggered) {
          doorsTriggered = true;
          handleAuthorizationSuccess();
        }
      }
    }, 24);

    function handleAuthorizationSuccess() {
      accessBanner.classList.add("granted");
      soundSuccess();
      
      setTimeout(() => {
        soundHeavyClunk();
        triggerMechanicalShift();
      }, 200);
    }

    function triggerMechanicalShift() {
      const vault = document.getElementById("vault");
      vault.classList.add("open");
      document.body.classList.add("vault-open");
      
      initThreeEngine();
      setTimeout(initiatePearlTransition, 2800);
    }

    /* ================= THREE.JS BACKGROUND SCENE ================= */
    let scene, camera, renderer, activeObject;

    function initThreeEngine() {
      try {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5;

        renderer = new THREE.WebGLRenderer({
          canvas: document.getElementById("three-canvas"),
          alpha: true,
          antialias: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const glowLight = new THREE.PointLight(0xd4a0a0, 8, 30);
        glowLight.position.set(0, 0, 2);
        scene.add(glowLight);

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        // Instantiate official module loader safely
        const loader = new GLTFLoader();
        
        loader.load("images/models/logo.glb", 
          (gltf) => {
            activeObject = gltf.scene;
            
            // Center model bounding metrics inside canvas view
            const box = new THREE.Box3().setFromObject(activeObject);
            const center = box.getCenter(new THREE.Vector3());
            activeObject.position.x += (activeObject.position.x - center.x);
            activeObject.position.y += (activeObject.position.y - center.y);
            activeObject.position.z += (activeObject.position.z - center.z);
            
            adjustActiveObjectScale();
            scene.add(activeObject);
          }, 
          undefined, 
          (error) => {
            outputHUDError("GLTF PATH MATCH EXCEPTION: Double check your local folder directory mapping layout.");
          }
        );

        window.addEventListener('resize', onResize);
        animateThree();

      } catch (globalEngineError) {
        outputHUDError("RUNTIME INTERCEPT: " + globalEngineError.message);
      }
    }

    // Dynamic scale calculations based on device width
    function adjustActiveObjectScale() {
      if (!activeObject) return;
      const width = window.innerWidth;
      
      if (width < 480) {
        // Mobile Phones
        activeObject.scale.set(0.8, 0.8, 0.8);
      } else if (width < 768) {
        // Tablets
        activeObject.scale.set(1.0, 1.0, 1.0);
      } else if (width < 1400) {
        // Laptops / Small Desktops
        activeObject.scale.set(1.5, 1.5, 1.5);
      } else {
        // Ultra-wide / Large Displays
        activeObject.scale.set(2.0, 2.0, 2.0);
      }
    }

    function outputHUDError(message) {
      console.error(message);
      const errDiv = document.createElement("div");
      errDiv.className = "line error-log";
      errDiv.textContent = `> ${message}`;
      statusPanel.appendChild(errDiv);
      setTimeout(() => errDiv.classList.add("show"), 30);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      adjustActiveObjectScale(); // Re-trigger layout calculations
    }

    function animateThree() {
      requestAnimationFrame(animateThree);
      if (activeObject) {
        activeObject.rotation.y += 0.008;
        activeObject.rotation.x += 0.003;
      }
      renderer.render(scene, camera);
    }

    /* ================= SHIMMER MICRO-PEARLS ESCALATION ================= */
    const pearlCanvas = document.getElementById("pearls-canvas");
    const pCtx = pearlCanvas.getContext("2d");
    let transitionParticles = [];
    let transitionActive = false;
    let spawnRate = 0.2; 

    function initiatePearlTransition() {
      pearlCanvas.width = window.innerWidth;
      pearlCanvas.height = window.innerHeight;
      transitionActive = true;
      
      animatePearls();
      
      setTimeout(() => {
        document.body.classList.add("pull-up");
      }, 2400);

      setTimeout(() => {
        window.location.href = "home.html";
      }, 3900);
    }

    function animatePearls() {
      if(!transitionActive) return;
      requestAnimationFrame(animatePearls);
      pCtx.clearRect(0, 0, pearlCanvas.width, pearlCanvas.height);

      if (spawnRate < 22) spawnRate += 0.09;

      if (Math.random() < 0.15 * spawnRate) {
        transitionParticles.push({
          x: Math.random() * window.innerWidth,
          y: window.innerHeight + 10,
          radius: Math.random() * 1.6 + 0.6, 
          speedY: -(Math.random() * 4 + 2.5),
          wobbleSpeed: Math.random() * 0.06,
          wobbleRange: Math.random() * 1.2,
          phase: Math.random() * Math.PI
        });
      }

      for(let i = transitionParticles.length - 1; i >= 0; i--) {
        let pt = transitionParticles[i];
        pt.y += pt.speedY;
        pt.phase += pt.wobbleSpeed;
        pt.x += Math.sin(pt.phase) * pt.wobbleRange;

        if (pt.y < -20) {
          transitionParticles.splice(i, 1);
          continue;
        }

        let grad = pCtx.createRadialGradient(pt.x - pt.radius*0.2, pt.y - pt.radius*0.2, 0, pt.x, pt.y, pt.radius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, '#fff4f4');
        grad.addColorStop(1, '#cca6a6');

        pCtx.beginPath();
        pCtx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
        pCtx.fillStyle = grad;
        pCtx.shadowColor = "rgba(255,255,255,0.4)";
        pCtx.shadowBlur = 4;
        pCtx.fill();
      }
    }

    setTimeout(printLog, 500);
  </script>
</body>
</html>
